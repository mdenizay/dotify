[package]
name = "dotify-cli"
description = "Headless Dotify project manipulation and export"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "dotify"
path = "src/main.rs"

[dependencies]
dotify-core.workspace = true
dotify-export.workspace = true
serde_json.workspace = true
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
tempfile.workspace = true
serde_json.workspace = true
